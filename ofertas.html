    <script src="script.js"></script>

    <script>

        function carregarPaginaOfertas() {
            const gridOfertas = document.getElementById('grid-apenas-ofertas');
            if (!gridOfertas) return;

            const ofertasValidas = db.produtos.filter(p => p.isOferta);

            if (ofertasValidas.length === 0) {
                gridOfertas.innerHTML = "<p>Nenhuma oferta ativa no momento.</p>";
                return;
            }

            gridOfertas.innerHTML = ofertasValidas.map(p => `
        <div class="product-card">
            <div class="badge-desconto">PROMOÇÃO</div>
            <img src="${p.imagens[0]}" alt="${p.nome}">
            <h4>${p.nome}</h4>
            <p class="preco-antigo">De: R$ ${p.precoAntigo}</p>
            <p class="preco-atual">Por: R$ ${p.preco}</p>
            <button onclick="localStorage.setItem('produtoAtualID', '${p.id}'); window.location.href='produto.html'">Ver Detalhes</button>
        </div>
    `).join('');
        }

        // Adicione ao seu DOMContentLoaded:
        document.addEventListener('DOMContentLoaded', () => {
            carregarPaginaOfertas();
        });
    </script>
