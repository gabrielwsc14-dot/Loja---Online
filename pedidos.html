<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - Jequitinhonha</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tabs-pedidos {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: #ddd;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: #3483fa;
            color: white;
        }
        .pedido-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .status-a-pagar { background: #fff159; color: #333; }
        .status-pago { background: #e3f2fd; color: #1976d2; }
        .status-entregue { background: #e8f5e9; color: #2e7d32; }
        .status-cancelado { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>
    <header class="main-header">
    <div class="nav-container">
        <div class="logo-placeholder" onclick="window.location.href='index.html'" style="cursor:pointer">
            <img src="img/JH-img.png" alt="JH BABY ENXOVAL">
        </div>
        <nav class="user-nav">
            </nav>
    </div>
</header>

    <main class="content-wrapper">
        <h2 class="section-title">Meus Pedidos</h2>

        <div class="tabs-pedidos">
            <button class="tab-btn active" onclick="filtrarPedidos('todos', this)">Todos</button>
            <button class="tab-btn" onclick="filtrarPedidos('A Pagar', this)">A Pagar</button>
            <button class="tab-btn" onclick="filtrarPedidos('Pago', this)">A Receber</button>
            <button class="tab-btn" onclick="filtrarPedidos('Entregue', this)">Entregues</button>
            <button class="tab-btn" onclick="filtrarPedidos('Cancelado', this)">Cancelados</button>
        </div>

        <div id="lista-pedidos">
            </div>
    </main>

    <script src="script.js"></script>
    <script src="main.js"></script>
</body>
</html>
